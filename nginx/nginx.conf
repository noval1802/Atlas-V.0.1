worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Compression — Next.js gzips its own HTML but not Route Handler responses,
    # so the JSON APIs arrive here uncompressed. /api/cctv?region=all alone is
    # ~4.3 MB of JSON that gzips to ~0.5 MB, so this is the difference between a
    # usable and an unusable first load on anything but a LAN.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        application/xml
        application/geo+json
        text/plain
        text/css
        text/javascript
        image/svg+xml;

    # Define a cache zone named 'tile_cache', with a 100MB RAM index, and 10GB max disk size.
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=tile_cache:100m max_size=10g inactive=365d use_temp_path=off;

    # The tile path exactly as the browser sent it. The location regex below sees
    # the decoded URI, which would put a raw space into font paths ("Open%20Sans").
    map $request_uri $tile_raw_path {
        ~^/proxy/tiles/[^/?]+/(?<p>.*)$ $p;
        default "";
    }

    # DNS resolver required to resolve upstream domain names
    resolver 1.1.1.1 8.8.8.8 valid=300s;

    server {
        listen 8080;
        
        # Route 1: Proxy CARTO basemap requests (vector tiles, sprite, glyphs, style).
        # The app sends them here when TILE_PROXY_PATH=/proxy/tiles. Allowlist the
        # host inside the regex: basemaps, tiles, tiles-a..d and a..d subdomains only.
        location ~ ^/proxy/tiles/(?<target_domain>(?:(?:tiles-)?[a-d]\.|tiles\.)?basemaps\.cartocdn\.com)/ {

            # Reconstruct the upstream URL (path and query kept URL-encoded)
            proxy_pass https://$target_domain/$tile_raw_path;
            
            # Essential Headers for upstream
            proxy_set_header Host $target_domain;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            
            # Strip cookies just in case
            proxy_hide_header Set-Cookie;
            proxy_ignore_headers Set-Cookie;
            
            # Caching Rules
            proxy_cache tile_cache;
            proxy_cache_valid 200 304 365d;   # Cache successful responses for 1 year
            proxy_cache_valid any 1m;         # Cache failures for 1 min
            proxy_cache_lock on;              # Prevent thundering herd
            
            # Force browser caching
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Status $upstream_cache_status;
            
        }

        # Catch-all 403 — nginx checks regex locations in source order, so the
        # allowlist above still wins for cartocdn requests.
        location ~ ^/proxy/tiles/ {
            return 403;
        }

        # Route 2: Pass everything else to OSIRIS
        location / {
            # In docker-compose, 'osiris' is the hostname of the Next.js container
            proxy_pass http://osiris:3000;
            
            proxy_set_header Host $http_host;  # keeps :8080 so the Origin check in src/proxy.ts matches
            proxy_set_header X-Real-IP $remote_addr;
            # No CDN sits in front of this nginx, so these can only be client-forged.
            # The app trusts them first for rate limits; blank them here.
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header True-Client-IP "";
            proxy_set_header X-Vercel-Forwarded-For "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts — flights/cctv/satellites fan out to slow external APIs
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            # Buffering — flights response is ~5MB, default 4k buffers choke on it
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 32 64k;
            proxy_busy_buffers_size 128k;
            
            # WebSocket support (Required for Next.js hot reloading and potential live feeds)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
