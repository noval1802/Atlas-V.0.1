<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="ATLAS">
  <title>ATLAS</title>
  <defs>
    <line id="tick" x1="898" y1="512" x2="934" y2="512" stroke="#D4AF37" stroke-width="10"/>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .orbit { transform-box: view-box; transform-origin: 512px 512px; animation: spin 30s linear infinite; }
      .orbit.reverse { animation-duration: 20s; animation-direction: reverse; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .orbit { animation: none; } }
    </style>
  </defs>
  <g fill="none" stroke="#D4AF37" stroke-linecap="butt">
    <path d="M543.25 65.09 A448 448 0 1 1 480.75 65.09" stroke-width="8"/>
    <use href="#tick" transform="rotate(-81.82 512 512)"/>
    <use href="#tick" transform="rotate(-65.45 512 512)"/>
    <use href="#tick" transform="rotate(-49.09 512 512)"/>
    <use href="#tick" transform="rotate(-32.73 512 512)"/>
    <use href="#tick" transform="rotate(-16.36 512 512)"/>
    <use href="#tick" transform="rotate(0 512 512)"/>
    <use href="#tick" transform="rotate(16.36 512 512)"/>
    <use href="#tick" transform="rotate(32.73 512 512)"/>
    <use href="#tick" transform="rotate(49.09 512 512)"/>
    <use href="#tick" transform="rotate(65.45 512 512)"/>
    <use href="#tick" transform="rotate(81.82 512 512)"/>
    <use href="#tick" transform="rotate(98.18 512 512)"/>
    <use href="#tick" transform="rotate(114.55 512 512)"/>
    <use href="#tick" transform="rotate(130.91 512 512)"/>
    <use href="#tick" transform="rotate(147.27 512 512)"/>
    <use href="#tick" transform="rotate(163.64 512 512)"/>
    <use href="#tick" transform="rotate(180 512 512)"/>
    <use href="#tick" transform="rotate(196.36 512 512)"/>
    <use href="#tick" transform="rotate(212.73 512 512)"/>
    <use href="#tick" transform="rotate(229.09 512 512)"/>
    <use href="#tick" transform="rotate(245.45 512 512)"/>
    <use href="#tick" transform="rotate(261.82 512 512)"/>
    <circle cx="512" cy="512" r="305" stroke-width="8"/>
    <circle cx="512" cy="512" r="247" stroke-width="6"/>
    <ellipse cx="512" cy="512" rx="131" ry="247" stroke-width="6"/>
    <path d="M323.83 352 Q512 374.58 700.17 352" stroke-width="6"/>
    <path d="M278.31 432 Q512 460.04 745.69 432" stroke-width="6"/>
    <path d="M270.11 562 Q512 591.03 753.89 562" stroke-width="12"/>
    <path d="M296.11 632 Q512 657.91 727.89 632" stroke-width="6"/>
    <g stroke-width="8" stroke-linecap="round">
      <line x1="226" y1="512" x2="470" y2="512"/>
      <line x1="554" y1="512" x2="798" y2="512"/>
      <line x1="512" y1="226" x2="512" y2="470"/>
      <line x1="512" y1="554" x2="512" y2="798"/>
    </g>
  </g>
  <circle cx="512" cy="512" r="20" fill="#D4AF37"/>
  <path d="M512 40 L554 124 L512 104 L470 124 Z" fill="#F0D060"/>
  <!-- Dashed radar ring and its two tracks move together along the ring. -->
  <g class="orbit">
    <circle cx="512" cy="512" r="352" fill="none" stroke="#8B7325" stroke-width="6" pathLength="700" stroke-dasharray="6 4"/>
    <circle cx="777.66" cy="281.07" r="16" fill="#00E5FF" filter="url(#glow)"/>
    <circle cx="254.56" cy="752.06" r="16" fill="#00E5FF" filter="url(#glow)"/>
  </g>
  <g class="orbit reverse">
    <circle cx="285.34" cy="307.92" r="16" fill="#00E5FF" filter="url(#glow)"/>
