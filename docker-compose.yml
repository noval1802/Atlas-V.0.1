name: osiris

# Every service rotates its JSON logs instead of growing them until the disk fills.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Inside the stack the app reaches Postgres by service name. This overrides any
# DATABASE_URL in .env (which points at 127.0.0.1:5433 for host-side tools).
# Use a URL-safe password, e.g. `openssl rand -hex 24`.
x-database-url: &database-url "postgresql://osiris:${OSIRIS_POSTGRES_PASSWORD:?set OSIRIS_POSTGRES_PASSWORD in .env}@osiris-postgres:5432/osiris_ops"

services:
  osiris:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osiris
    # Loopback only: users come in through osiris-cache (HTTPS). This port is for
    # checks on the host itself.
    ports:
      - "127.0.0.1:${OSIRIS_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_OPTIONS: --dns-result-order=ipv4first
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: *database-url
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      osiris-postgres:
        condition: service_healthy
      osiris-migrate:
        condition: service_completed_successfully
    # Ready means Postgres answers too: without it every session lookup fails.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *logging
    restart: unless-stopped

  # One-shot: applies migrations and seeds missing rows, then exits. The app waits for it.
  osiris-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: osiris-migrate
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: *database-url
    depends_on:
      osiris-postgres:
        condition: service_healthy
    logging: *logging
    restart: "no"

  osiris-cache:
    image: nginx:alpine
    container_name: osiris-cache
    # 8443 serves HTTPS; 8080 only redirects to it. nginx/nginx.conf hard-codes
    # 8443 in that redirect, so change both together.
    ports:
      - "8443:8443"
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      osiris:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/nginx-health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
    restart: unless-stopped

  osiris-intel:
    build:
      context: ./intel
      dockerfile: Dockerfile
    container_name: osiris-intel
    ports:
      - "127.0.0.1:4000:4000"  # only the app calls intel; it has no auth of its own
    logging: *logging
    restart: unless-stopped

  osiris-postgres:
    image: postgres:16-alpine
    container_name: osiris-postgres
    environment:
      POSTGRES_USER: osiris
      POSTGRES_PASSWORD: ${OSIRIS_POSTGRES_PASSWORD:?set OSIRIS_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: osiris_ops
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - osiris-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osiris -d osiris_ops"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging
    restart: unless-stopped

  # Daily pg_dump into ${BACKUP_PATH} on this host. Restore: ops/backup/restore.sh.
  # Copy that directory off this server as well; a backup on the same disk does
  # not survive losing the disk.
  osiris-backup:
    image: postgres:16-alpine
    container_name: osiris-backup
    entrypoint: ["sh", "/ops/backup.sh"]
    environment:
      PGHOST: osiris-postgres
      PGUSER: osiris
      PGDATABASE: osiris_ops
      PGPASSWORD: ${OSIRIS_POSTGRES_PASSWORD:?set OSIRIS_POSTGRES_PASSWORD in .env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./ops/backup:/ops:ro
      - ${BACKUP_PATH:-./backups}:/backups
    depends_on:
      osiris-postgres:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

volumes:
  nginx-cache:
  osiris-postgres-data:
